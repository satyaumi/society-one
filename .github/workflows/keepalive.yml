name: Production KeepAlive Heartbeat

on:
  schedule:
    # Run every 10 minutes to prevent Render free-tier hibernation
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping SocietyOne Production Backend
        run: |
          echo "Pinging backend..."
          curl -s -f -m 60 "https://society-one-backend.onrender.com/api/health" || true
      - name: Ping SocietyOne Frontend
        run: |
          echo "Pinging frontend..."
          curl -s -f -m 60 "https://society-one-frontend.vercel.app" || true
