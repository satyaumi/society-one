spring:
  application:
    name: societyone-backend
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:societyone-backend/.env[.properties]
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/societyone}
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:postgres}}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:25}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: SocietyOneHikariPool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  mail:
    host: ${SPRING_MAIL_HOST:${SMTP_HOST:smtp.gmail.com}}
    port: ${SPRING_MAIL_PORT:${SMTP_PORT:587}}
    username: ${SPRING_MAIL_USERNAME:${SMTP_USERNAME:}}
    password: ${SPRING_MAIL_PASSWORD:${SMTP_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:${SMTP_AUTH:true}}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:${SMTP_STARTTLS:true}}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${PORT:${SERVER_PORT:8081}}
  address: ${SERVER_ADDRESS:0.0.0.0}
  shutdown: graceful
  tomcat:
    threads:
      max: ${TOMCAT_THREADS_MAX:200}
      min-spare: ${TOMCAT_THREADS_MIN_SPARE:20}
    max-connections: 8192
    accept-count: 100
    connection-timeout: 20000

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

societyone:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:4173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:4173}
    jwt:
      secret: ${JWT_SECRET:KrHYbZiErgOZGL3TStmT/lSpso1dWffBoH94bZw615s=}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  mail:
    from: ${MAIL_FROM:noreply@societyone.com}
    from-name: ${MAIL_FROM_NAME:SocietyOne}
    enabled: ${MAIL_ENABLED:true}
    dev-fallback-enabled: ${MAIL_DEV_FALLBACK_ENABLED:true}